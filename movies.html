<!DOCTYPE html>
<html lang="ru" style="background-color: #050816; color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050816">
    <style>
        html, body {
            background-color: #050816 !important;
            color-scheme: dark;
        }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://ribxwepxmiywgyrkzjlp.supabase.co https://*.supabase.co; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Киноклуб — Фильмы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="movies">
    <header class="site-header">
        <div class="brand-block">
            <a class="brand" href="index.html">Qeqoqeq кино</a>
            <p class="brand-note">Выбирайте, смотрите, оценивайте</p>
        </div>
        <nav class="site-nav" aria-label="Основная навигация">
            <a class="nav-link" href="index.html">Колесо</a>
            <a class="nav-link active" href="movies.html">Фильмы</a>
            <a class="nav-link" href="add.html">Добавить</a>
            <a class="nav-link" href="rating.html">Оценка</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="panel movies-panel">
            <div class="section-title">
                <h2>Фильмы</h2>
                <span id="moviesTotalBadge" class="movies-count-badge"></span>
            </div>
            <div class="search-row">
                <label class="search-field" for="moviesSearchInput">
                    <span>Поиск</span>
                    <input id="moviesSearchInput" type="search" placeholder="Название, жанр, комментарий или статус">
                </label>
                <button type="button" id="clearMoviesSearchBtn" class="secondary-button">Сбросить</button>
            </div>
            <div class="table-wrap">
                <table id="moviesTable">
                    <thead>
                        <tr>
                            <th class="sortable col-title" data-sort-key="title" role="button" tabindex="0" title="Сортировать по названию">
                                <span class="th-content">Название <span class="sort-icon" aria-hidden="true">↕</span></span>
                            </th>
                            <th class="sortable col-genre" data-sort-key="genre" role="button" tabindex="0" title="Сортировать по жанру">
                                <span class="th-content">Жанр <span class="sort-icon" aria-hidden="true">↕</span></span>
                            </th>
                            <th class="col-comment">Комментарий</th>
                            <th class="sortable col-status" data-sort-key="status" role="button" tabindex="0" title="Сортировать по статусу">
                                <span class="th-content">Статус <span class="sort-icon" aria-hidden="true">↕</span></span>
                            </th>
                            <th class="sortable col-rating" data-sort-key="ratings" role="button" tabindex="0" title="Сортировать по оценке">
                                <span class="th-content">Оценка <span class="sort-icon" aria-hidden="true">↕</span></span>
                            </th>
                            <th class="col-actions">Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Блок пагинации -->
            <div id="moviesPagination" class="pagination-bar">
                <div class="pagination-info">
                    <span id="pageRangeText">Загрузка...</span>
                    <label class="per-page-select-label">
                        <span>На странице:</span>
                        <select id="perPageSelect">
                            <option value="6">6</option>
                            <option value="8" selected>8</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="25">25</option>
                        </select>
                    </label>
                </div>
                <div class="pagination-controls">
                    <button type="button" id="prevPageBtn" class="page-btn" aria-label="Предыдущая страница">
                        <span>←</span> Назад
                    </button>
                    <div id="paginationNumbers" class="pagination-numbers"></div>
                    <button type="button" id="nextPageBtn" class="page-btn" aria-label="Следующая страница">
                        Вперёд <span>→</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Модал редактирования -->
        <div id="movieModal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop" data-modal-close></div>
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="movieModalTitle">
                <div class="modal-header">
                    <div>
                        <p class="eyebrow">Редактирование</p>
                        <h2 id="movieModalTitle">Редактировать фильм</h2>
                    </div>
                    <button type="button" class="modal-close" data-modal-close aria-label="Закрыть окно">×</button>
                </div>

                <form id="movieEditForm" class="movie-form modal-form">
                    <input type="hidden" id="movieEditId">
                    <label>
                        <span>Название</span>
                        <input type="text" id="movieEditTitle" required>
                    </label>
                    <label>
                        <span>Жанр</span>
                        <input type="text" id="movieEditGenre">
                    </label>
                    <label>
                        <span>Комментарий</span>
                        <textarea id="movieEditComment"></textarea>
                    </label>
                    <label>
                        <span>Статус</span>
                        <select id="movieEditStatus">
                            <option>Не просмотрено</option>
                            <option>Просмотрено</option>
                            <option>Запланировано</option>
                            <option>Скоро выйдет</option>
                            <option>Не вышел</option>
                            <option>НЕ ОХОТА</option>
                        </select>
                    </label>
                    <label>
                        <span>Оценка (от -1 до 11 или несколько через запятую):</span>
                        <input type="text" id="movieEditRatings" placeholder="Например: 8 или 7, 8, 9, 10">
                        <div id="movieEditRatingCalcInfo" class="multi-rating-calc-info hidden"></div>
                        <div class="rating-preview-row">
                            <span class="rating-preview-label">Предпросмотр:</span>
                            <div id="movieEditRatingPreview" class="rating-preview-result"><span class="muted">-</span></div>
                        </div>
                    </label>
                    <div class="modal-actions">
                        <button type="button" id="movieModalDeleteBtn" class="danger-button">Удалить фильм</button>
                        <button type="button" class="secondary-button" data-modal-close>Отмена</button>
                        <button type="submit" class="primary-button">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/movies.js"></script>
</body>

</html>
